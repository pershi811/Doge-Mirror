name: Deploy Doge Mirror to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE=""

          if [ -f "doge_mirror/_sites/doge.hdm1.net/index.html" ]; then
            SOURCE="doge_mirror/_sites/doge.hdm1.net"
          elif [ -d "doge_mirror/_sites" ]; then
            SOURCE="$(find doge_mirror/_sites -type f -name index.html -print -quit | xargs -r dirname)"
          elif [ -f "index.html" ]; then
            SOURCE="."
          fi

          if [ -z "$SOURCE" ] || [ ! -f "$SOURCE/index.html" ]; then
            echo "::error::Could not find the website's index.html file."
            echo "Check the location of your website files in the repository."
            exit 1
          fi

          echo "Publishing website from: $SOURCE"
          cp -a "$SOURCE/." dist/
          test -f dist/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
