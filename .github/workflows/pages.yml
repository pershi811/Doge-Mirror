```yaml
name: Deploy Doge Mirror to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Find and prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          SOURCE=""

          # Check the expected website location first.
          DEFAULT_SOURCE="doge_mirror/_sites/doge.hdm1.net"

          if [ -f "$DEFAULT_SOURCE/index.html" ]; then
            SOURCE="$DEFAULT_SOURCE"
          fi

          # If the default location does not exist, search for index.html.
          if [ -z "$SOURCE" ] && [ -d "doge_mirror/_sites" ]; then
            while IFS= read -r -d '' FILE; do
              SOURCE="$(dirname "$FILE")"
              break
            done < <(
              find doge_mirror/_sites \
                -type f \
                -name index.html \
                -print0
            )
          fi

          # Also support a website uploaded directly to the repository root.
          if [ -z "$SOURCE" ] && [ -f "index.html" ]; then
            SOURCE="."
          fi

          # Stop with a clear error if the website cannot be found.
          if [ -z "$SOURCE" ]; then
            echo "::error::Could not find index.html."
            echo "Expected doge_mirror/_sites/doge.hdm1.net/index.html"
            echo "or another index.html under doge_mirror/_sites/."
            exit 1
          fi

          echo "Publishing website from: $SOURCE"

          # Copy the complete website, including hidden files.
          cp -a "$SOURCE/." dist/

          # Verify the published root contains index.html.
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html was not created."
            exit 1
          fi

          echo "Website ready for deployment:"
          find dist -maxdepth 2 -type f | head -50

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
```
