name: Deploy Doge Mirror to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          SOURCE=""

          if [ -f "doge_mirror/_sites/doge.hdm1.net/index.html" ]; then
            SOURCE="doge_mirror/_sites/doge.hdm1.net"
          elif [ -f "index.html" ]; then
            SOURCE="."
          elif [ -d "doge_mirror/_sites" ]; then
            INDEX="$(find doge_mirror/_sites -type f -name index.html -print -quit)"
            if [ -n "$INDEX" ]; then
              SOURCE="$(dirname "$INDEX")"
            fi
          fi

          if [ -z "$SOURCE" ] || [ ! -f "$SOURCE/index.html" ]; then
            echo "::error::Could not find the website index.html"
            find . -maxdepth 6 -type f -name index.html -print
            exit 1
          fi

          echo "Publishing complete website from: $SOURCE"
          cp -a "$SOURCE/." dist/
          touch dist/.nojekyll

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("dist")
          prefix = "/Doge-Mirror"

          # Fix root-relative links in HTML attributes.
          attrs = re.compile(
              r'(?P<attr>\b(?:href|src|action|poster|data|cite|background)\s*=\s*)'
              r'(?P<quote>["\'])(?P<url>.*?)(?P=quote)',
              re.IGNORECASE
          )

          def fix_url(url):
              if not url.startswith("/") or url.startswith("//"):
                  return url
              if url == prefix or url.startswith(prefix + "/"):
                  return url
              return prefix + url

          for file in root.rglob("*"):
              if not file.is_file():
                  continue

              suffix = file.suffix.lower()

              try:
                  text = file.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original = text

              if suffix in {".html", ".htm"}:
                  text = attrs.sub(
                      lambda m: (
                          m.group("attr") + m.group("quote")
                          + fix_url(m.group("url"))
                          + m.group("quote")
                      ),
                      text
                  )

              if suffix in {".html", ".htm", ".css"}:
                  text = re.sub(
                      r'url\((\s*)(["\']?)(/[^)"\']+)\2(\s*)\)',
                      lambda m: (
                          "url(" + m.group(1) + m.group(2)
                          + fix_url(m.group(3)) + m.group(2) + m.group(4) + ")"
                      ),
                      text,
                      flags=re.IGNORECASE
                  )

              if text != original:
                  file.write_text(text, encoding="utf-8")

          print("Adjusted common root-relative HTML and CSS links.")
          PY

          test -f dist/index.html

          echo "Website files ready:"
          find dist -maxdepth 3 -type f | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
