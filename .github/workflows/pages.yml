name: Deploy Doge Mirror to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          # Locate the complete mirrored website.
          if [ -f "doge_mirror/_sites/doge.hdm1.net/index.html" ]; then
            SOURCE="doge_mirror/_sites/doge.hdm1.net"
          elif [ -f "index.html" ]; then
            SOURCE="."
          elif [ -d "doge_mirror/_sites" ]; then
            INDEX="$(find doge_mirror/_sites -type f -name index.html -print -quit)"
            if [ -n "$INDEX" ]; then
              SOURCE="$(dirname "$INDEX")"
            else
              echo "::error::No index.html found in doge_mirror/_sites"
              exit 1
            fi
          else
            echo "::error::Could not find the mirrored website folder."
            find . -maxdepth 5 -type f -name index.html -print
            exit 1
          fi

          echo "Publishing website from: $SOURCE"

          # Copy every file, including JavaScript bundles and subfolders.
          cp -a "$SOURCE/." dist/

          # Prevent GitHub Pages from processing the files with Jekyll.
          touch dist/.nojekyll

          # Verify that the homepage exists.
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing"
            exit 1
          fi

          # Verify the main JavaScript bundle when present in the source.
          if [ -f "$SOURCE/BewOoRVK.js" ] && [ ! -f dist/BewOoRVK.js ]; then
            echo "::error::Main JavaScript bundle was not copied"
            exit 1
          fi

          echo "Files prepared for deployment:"
          find dist -maxdepth 3 -type f | sort | head -200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
